[project]
name = "brain"
version = "0.1.0"
description = "Local full-text search over Claude Code, Codex and Pi conversation history"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["prompt-toolkit>=3.0.52,<4"]

[project.scripts]
brain = "brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]
